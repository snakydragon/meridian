services:
  meridian:
    build: .
    container_name: meridian-agent
    restart: unless-stopped
    env_file:
      - .env          # DRY_RUN, RPC_URL, HELIUS_API_KEY, LLM keys, wallet key, Telegram token
    volumes:
      # Repo root mounted AT the work directory: user-config.json is read live,
      # and state JSONs (state.json, pool-memory.json, ...) survive recreation.
      # node_modules is the linux build copied out of the image (see runbook).
      - ./.:/meridian
    environment:
      - HOME=/meridian
    # No ports published: the agent only makes OUTBOUND calls (RPC, OpenRouter,
    # Meteora, Telegram polling). Nothing needs to listen.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
